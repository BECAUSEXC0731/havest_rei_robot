slam_toolbox:
  ros__parameters:
    # ── 坐标系 ──
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    # ── 模式 ──
    mode: mapping
    use_map_saver: true

    # ── 地图 ──
    resolution: 0.05
    map_update_interval: 2.0
    transform_publish_period: 0.05
    transform_timeout: 0.2

    # ── 激光 ──
    max_laser_range: 6.0
    minimum_laser_range: 0.1

    # ── 扫描处理 ──
    throttle_scans: 1
    minimum_time_interval: 0.3

    # ── 回环 ──
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_search_maximum_distance: 5.0

    # ── 其他 ──
    debug_logging: false
